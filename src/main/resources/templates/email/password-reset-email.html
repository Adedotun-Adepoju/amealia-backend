<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .header {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .content {
            font-size: 16px;
            color: #333333;
            line-height: 1.6;
        }
        .code-box {
            margin: 30px 0;
            text-align: center;
        }
        .code {
            display: inline-block;
            font-size: 28px;
            letter-spacing: 6px;
            font-weight: bold;
            background-color: #f0f3f7;
            padding: 15px 25px;
            border-radius: 6px;
        }
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        Hello <span th:text="${name}">User</span>,
    </div>

    <div class="content">
        <p th:text="${introText}">
            We received a request that requires verification.
        </p>

        <p>Please use the verification code below:</p>

        <div class="code-box">
            <div class="code" th:text="${verificationCode}">123456</div>
        </div>

        <p>
            This code will expire in
            <strong th:text="${expiryMinutes}">5</strong> minutes.
        </p>

        <p th:text="${extraMessage}">
            If you did not make this request, please ignore this email.
        </p>
    </div>

    <div class="footer">
        &copy; 2026 Amealia. All rights reserved.
    </div>
</div>
</body>
</html>
