<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Verification Code</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 24px;
        }

        .header {
            text-align: center;
            padding-bottom: 24px;
        }

        .content {
            color: #333333;
            font-size: 15px;
            line-height: 1.6;
        }

        .code-box {
            margin: 24px 0;
            padding: 16px;
            background-color: #f1f5f9;
            border-radius: 6px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 6px;
            color: #111827;
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #777777;
            text-align: center;
        }
    </style>
</head>
<body>

<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">
            <table class="container" width="100%" cellpadding="0" cellspacing="0">

                <!-- Header -->
                <tr>
                    <td class="header">
                        <h2>Email Verification</h2>
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td class="content">
                        <p>
                            Hello <span th:text="${name}">User</span>,
                        </p>

                        <p>
                            Use the verification code below to confirm your email address.
                        </p>

                        <div class="code-box" th:text="${verificationCode}">
                            123456
                        </div>

                        <p>
                            This code will expire in
                            <span th:text="${expiryMinutes}">5</span> minutes.
                        </p>

                        <p>
                            If you did not request this code, please ignore this email.
                        </p>

                        <p>
                            Best regards,<br>
                            <strong>Amealia Team</strong>
                        </p>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td class="footer">
                        <p>
                            © 2026 Amealia. All rights reserved.
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
